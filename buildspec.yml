version: 0.2

phases:
  install:
    commands:
      - echo "Installing dependencies..."
      - npm install

  build:
    commands:
      - echo "Build phase started..."
      - echo "Running application checks..."
      - node --check server.js

  post_build:
    commands:
      - echo "Build completed successfully."

artifacts:
  files:
    - server.js
    - package.json
    - appspec.yml
    - scripts/**/*
